name: Release

# Tag a version and the installers appear on the GitHub release:
#
#   npm version patch   # bumps package.json and makes the tag
#   git push --follow-tags
#
# A manual run builds and keeps the artifacts without publishing anything,
# which is the way to check the pipeline without cutting a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Electron's binary and electron-builder's toolchain are ~200MB of
      # downloads that never change between runs of the same version.
      - name: Restore Electron caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # A tag that disagrees with package.json produces a release whose
      # artifacts are named after a different version. Catch it before the
      # twenty-minute build rather than after.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi
          echo "releasing ${pkg}"

      # check:fonts opens a real BrowserWindow to measure glyph advances, so
      # it needs a display even though the window is never shown.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # --no-sandbox because Electron's setuid sandbox is unreliable on CI
      # runners. It only affects this build-time probe, never the shipped app.
      - name: Check the clock cannot reflow
        run: xvfb-run -a npm run check:fonts -- --no-sandbox

      # Runs typecheck for both tsconfigs, bundles, then packages.
      - name: Build and package
        run: npm run dist

      - name: List artifacts
        run: ls -lh release/*.AppImage release/*.deb

      # Published with the gh CLI rather than electron-builder's own
      # publisher: that one also writes a latest-linux.yml update feed, and
      # this app deliberately has no auto-updater.
      - name: Publish to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "Electric Clock ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" \
            release/*.AppImage release/*.deb --clobber

      - name: Keep artifacts for a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            release/*.AppImage
            release/*.deb
          retention-days: 7
          if-no-files-found: error
